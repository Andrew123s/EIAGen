# EIAGen assessment rules.
#
# Two strictly separate parts:
#   1. regulatory_screening_criteria - statutory screening criteria per jurisdiction.
#      Each criterion cites its source document (a document_id in the regulatory
#      library) and carries a verification_status. Criteria are encoded by the
#      project maintainers from their reading of the legislation; until a
#      qualified reviewer has checked a criterion against the current official
#      text, it stays "unverified" and every result based on it is flagged.
#   2. risk_methodology - a transparent, project-defined environmental risk
#      prioritisation heuristic. It is NOT a statutory method and must never be
#      used as a substitute for legal EIA classification.

rules_version: "2026.11-2"

parameters:
  project_area_ha: {label: Project area, unit: ha}
  installed_capacity_mw: {label: Installed capacity, unit: MW}
  turbine_count: {label: Number of wind turbines, unit: turbines}
  turbine_height_m: {label: Wind turbine total height, unit: m}
  road_length_km: {label: Road length, unit: km}
  lanes: {label: Number of traffic lanes, unit: lanes}
  production_capacity: {label: Production / throughput capacity, unit: as stated}
  water_demand: {label: Water demand, unit: m3/day}
  wastewater_volume: {label: Wastewater volume, unit: m3/day}
  energy_demand: {label: Energy demand, unit: as stated}
  workforce: {label: Workforce, unit: persons}
  housing_units: {label: Housing units, unit: units}
  waste_capacity: {label: Waste handling capacity, unit: as stated}
  livestock_count: {label: Livestock places, unit: animals}
  broiler_count: {label: Broiler places, unit: birds}
  hen_count: {label: Laying-hen places, unit: birds}
  pig_count: {label: Production pig places (over 30 kg), unit: animals}
  sow_count: {label: Sow places, unit: animals}
  project_duration_months: {label: Project / construction duration, unit: months}
  settlement_distance_km: {label: Distance to nearest settlement, unit: km}
  resettled_households: {label: Households / families to be resettled, unit: households}
  explosives_used: {label: Use of explosives (1 = stated), unit: flag}

regulatory_screening_criteria:
  # ------------------------------------------------------------------ Ghana
  # official_text_check records an AI-assisted comparison with the official text
  # (2026-11-01). It is NOT a qualified human verification: verification_status
  # stays "unverified" until a reviewer confirms each criterion.
  - id: GH-LI1652-R1
    jurisdiction: ghana
    title: Registration and environmental permit for listed undertakings (Schedule 1)
    description: >-
      Regulation 1(1) of L.I. 1652: no person shall commence an undertaking specified in Schedule 1 unless it
      has been registered and an environmental permit issued. Regulation 1(2) also requires registration of
      any undertaking which in the regulator's opinion is likely to have an adverse effect on the environment
      or public health.
    source_document_id: gh-li1652
    source_section: Regulation 1; Schedule 1
    official_source: {document_id: gh-li1652-official, anchor: "No person shall commence any of the undertakings specified in Schedule 1"}
    official_text_check: {status: consistent, checked_on: "2026-11-01", note: "Reg. 1(1) and 1(2) wording matches the criterion; Schedule 1 entries carry their own size/location conditions that are not encoded."}
    condition:
      sectors_any: [mining, agriculture, manufacturing, renewable_energy, road_construction, housing_development, waste_management, water_infrastructure]
    outcome_if_met: Environmental registration and environmental permit potentially required
    screening_category: registration_and_permit
    verification_status: unverified

  - id: GH-LI1652-S2-01A
    jurisdiction: ghana
    title: Land development for agriculture of not less than 40 ha (Schedule 2, item 1(a))
    description: Schedule 2 (Regulation 3) lists land development for agriculture purposes not less than 40 hectares as an undertaking for which EIA is mandatory.
    source_document_id: gh-li1652
    source_section: Regulation 3; Schedule 2, item 1(a)
    official_source: {document_id: gh-li1652-official, anchor: "land development for agriculture purposes not less than 40 hectares"}
    official_text_check: {status: added_from_official_text, checked_on: "2026-11-01"}
    condition:
      sectors_any: [agriculture]
      parameter: {name: project_area_ha, op: ">=", value: 40}
    outcome_if_met: Mandatory EIA (Schedule 2) category potentially relevant
    screening_category: environmental_impact_assessment
    verification_status: unverified
  - id: GH-LI1652-S2-01B
    jurisdiction: ghana
    title: Agricultural programmes resettling 20 or more families (Schedule 2, item 1(b))
    description: Schedule 2 lists agricultural programmes necessitating the resettlement of 20 families or more.
    source_document_id: gh-li1652
    source_section: Regulation 3; Schedule 2, item 1(b)
    official_source: {document_id: gh-li1652-official, anchor: "agricultural programmes necessitating the resettlement of 20 families or more"}
    official_text_check: {status: added_from_official_text, checked_on: "2026-11-01"}
    condition:
      sectors_any: [agriculture, water_infrastructure]
      activities_any: [land_acquisition_resettlement]
      parameter: {name: resettled_households, op: ">=", value: 20}
    outcome_if_met: Mandatory EIA (Schedule 2) category potentially relevant
    screening_category: environmental_impact_assessment
    verification_status: unverified
  - id: GH-LI1652-S2-03
    jurisdiction: ghana
    title: Construction of dams and man-made lakes (Schedule 2, items 3(a), 13(b), 16(a))
    description: Schedule 2 lists construction of dams and man-made lakes, dams and hydroelectric power schemes, and dams impounding reservoirs for water supply.
    source_document_id: gh-li1652
    source_section: Regulation 3; Schedule 2, items 3(a), 13(b), 16(a)
    official_source: {document_id: gh-li1652-official, anchor: "construction of dams and man-made lakes"}
    official_text_check: {status: added_from_official_text, checked_on: "2026-11-01"}
    condition:
      activities_any: [impoundment_dam]
    outcome_if_met: Mandatory EIA (Schedule 2) category potentially relevant
    screening_category: environmental_impact_assessment
    verification_status: unverified
  - id: GH-LI1652-S2-07
    jurisdiction: ghana
    title: Housing development (Schedule 2, item 7)
    description: Schedule 2 lists human settlement development undertakings and housing development (no size threshold stated in the text consulted).
    source_document_id: gh-li1652
    source_section: Regulation 3; Schedule 2, item 7
    official_source: {document_id: gh-li1652-official, anchor: "human settlement development undertaking"}
    official_text_check: {status: added_from_official_text, checked_on: "2026-11-01"}
    condition:
      sectors_any: [housing_development]
    outcome_if_met: Mandatory EIA (Schedule 2) category potentially relevant
    screening_category: environmental_impact_assessment
    verification_status: unverified
  - id: GH-LI1652-S2-08
    jurisdiction: ghana
    title: Cement manufacture (Schedule 2, item 8, non-metallic industry)
    description: Schedule 2 item 8 (industry) lists non-metallic industry - cement. The transcribed text consulted is garbled at this entry; whether a capacity threshold applies must be checked in the gazetted instrument.
    source_document_id: gh-li1652
    source_section: Regulation 3; Schedule 2, item 8
    official_source: {document_id: gh-li1652-official, anchor: "Non-metallic -cement"}
    official_text_check: {status: added_from_official_text, checked_on: "2026-11-01", note: "Entry garbled in the FAOLEX transcription; threshold applicability unclear."}
    condition:
      sectors_any: [manufacturing]
      keywords_any: [cement]
    outcome_if_met: Mandatory EIA (Schedule 2) category potentially relevant
    screening_category: environmental_impact_assessment
    verification_status: unverified
  - id: GH-LI1652-S2-09
    jurisdiction: ghana
    title: Construction of roads and highways (Schedule 2, item 9(c))
    description: Schedule 2 item 9 (infrastructure) lists construction of roads and highways (no size threshold stated).
    source_document_id: gh-li1652
    source_section: Regulation 3; Schedule 2, item 9(c)
    official_source: {document_id: gh-li1652-official, anchor: "construction of roads and highways"}
    official_text_check: {status: added_from_official_text, checked_on: "2026-11-01"}
    condition:
      sectors_any: [road_construction]
    outcome_if_met: Mandatory EIA (Schedule 2) category potentially relevant
    screening_category: environmental_impact_assessment
    verification_status: unverified
  - id: GH-LI1652-S2-11A
    jurisdiction: ghana
    title: Mining and processing of minerals where the lease exceeds 10 ha (Schedule 2, item 11(a))
    description: Schedule 2 lists mining and processing of minerals in areas where the mining lease covers a total area in excess of 10 hectares. EIAGen uses the stated project area as a proxy for the lease area.
    source_document_id: gh-li1652
    source_section: Regulation 3; Schedule 2, item 11(a)
    official_source: {document_id: gh-li1652-official, anchor: "mining and processing of minerals in areas where the mining lease covers a total area"}
    official_text_check: {status: added_from_official_text, checked_on: "2026-11-01", note: "Threshold refers to the mining lease area, not the project footprint."}
    condition:
      sectors_any: [mining]
      keywords_any: [mine, mining, ore, mineral processing]
      parameter: {name: project_area_ha, op: ">", value: 10}
    outcome_if_met: Mandatory EIA (Schedule 2) category potentially relevant
    screening_category: environmental_impact_assessment
    verification_status: unverified
  - id: GH-LI1652-S2-11B
    jurisdiction: ghana
    title: Quarrying within 3 km of settlements (Schedule 2, item 11(b))
    description: Schedule 2 lists proposed quarrying of aggregate, limestone, silica, quartzite, sandstone, marble and decorative building stone within 3 kilometres of any existing village, residential, commercial or industrial area.
    source_document_id: gh-li1652
    source_section: Regulation 3; Schedule 2, item 11(b)
    official_source: {document_id: gh-li1652-official, anchor: "within 3 kilometers radius of any existing village"}
    official_text_check: {status: added_from_official_text, checked_on: "2026-11-01"}
    condition:
      keywords_any: [quarry, quarrying]
      parameter: {name: settlement_distance_km, op: "<=", value: 3}
    outcome_if_met: Mandatory EIA (Schedule 2) category potentially relevant
    screening_category: environmental_impact_assessment
    verification_status: unverified
  - id: GH-LI1652-S2-13E
    jurisdiction: ghana
    title: Erection of power transmission lines (Schedule 2, item 13(e))
    description: Schedule 2 item 13 (power generation and transmission) lists erection of power transmission lines.
    source_document_id: gh-li1652
    source_section: Regulation 3; Schedule 2, item 13(e)
    official_source: {document_id: gh-li1652-official, anchor: "erection of power transmission lines"}
    official_text_check: {status: added_from_official_text, checked_on: "2026-11-01"}
    condition:
      activities_any: [linear_infrastructure]
      keywords_any: [transmission line, power line]
    outcome_if_met: Mandatory EIA (Schedule 2) category potentially relevant
    screening_category: environmental_impact_assessment
    verification_status: unverified
  - id: GH-LI1652-S2-15A
    jurisdiction: ghana
    title: Municipal solid waste landfill and treatment facilities (Schedule 2, item 15)
    description: Schedule 2 item 15 lists, among others, construction of municipal solid waste incineration, composting, recovery/recycling plants, landfill facilities and waste depots, and secure landfills for hazardous waste.
    source_document_id: gh-li1652
    source_section: Regulation 3; Schedule 2, item 15
    official_source: {document_id: gh-li1652-official, anchor: "construction of municipal solid waste landfill facility"}
    official_text_check: {status: added_from_official_text, checked_on: "2026-11-01"}
    condition:
      activities_any: [landfilling_waste_treatment]
    outcome_if_met: Mandatory EIA (Schedule 2) category potentially relevant
    screening_category: environmental_impact_assessment
    verification_status: unverified
  - id: GH-LI1652-S2-15C
    jurisdiction: ghana
    title: Construction of a municipal sewage treatment plant (Schedule 2, item 15, municipal sewage)
    description: Schedule 2 item 15 (municipal sewage) lists construction of wastewater treatment plants, marine outfalls and night-soil treatment.
    source_document_id: gh-li1652
    source_section: Regulation 3; Schedule 2, item 15
    official_source: {document_id: gh-li1652-official, anchor: "municipal sewage"}
    official_text_check: {status: added_from_official_text, checked_on: "2026-11-01"}
    condition:
      keywords_any: [sewage treatment, wastewater treatment plant, marine outfall]
    outcome_if_met: Mandatory EIA (Schedule 2) category potentially relevant
    screening_category: environmental_impact_assessment
    verification_status: unverified
  - id: GH-LI1652-S2-OTHER
    jurisdiction: ghana
    title: Other Schedule 2 entries - manual check
    description: >-
      Schedule 2 contains further entries (airports, land reclamation, fisheries, forestry, chemical and
      petrochemical industry, ports, petroleum, resorts, water supply, conservation areas) that are not encoded.
      A qualified reviewer must check the undertaking against the full Schedule.
    source_document_id: gh-li1652
    source_section: Regulation 3; Schedule 2
    official_source: {document_id: gh-li1652-official, anchor: "No environmental permit shall be issued by the Agency for any of the undertakings mentioned in Schedule 2"}
    official_text_check: {status: consistent, checked_on: "2026-11-01"}
    condition:
      sectors_any: [mining, manufacturing, road_construction, waste_management, water_infrastructure, agriculture, renewable_energy, housing_development]
      always_indeterminate: true
    outcome_if_met: Mandatory EIA (Schedule 2) category potentially relevant
    screening_category: further_regulatory_screening
    verification_status: unverified
  - id: GH-LI1652-S5
    jurisdiction: ghana
    title: Location in an environmentally sensitive area (Schedule 5, items 1 and 4)
    description: >-
      Regulation 30(2) designates the areas in Schedule 5 as environmentally sensitive, including areas declared
      by law as national parks, watershed and wildlife reserves and sanctuaries (including sacred groves) and
      areas of unique historic or archaeological interest. Several Schedule 1 entries are triggered by location
      in such areas.
    source_document_id: gh-li1652
    source_section: Regulation 30(2); Schedule 5
    official_source: {document_id: gh-li1652-official, anchor: "All areas declared by law as national parks"}
    official_text_check: {status: corrected, checked_on: "2026-11-01", note: "Schedule 5 is designated by Regulation 30(2), not Regulation 3 as previously encoded."}
    condition:
      flags_any: [near_protected_area, near_cultural_heritage]
    outcome_if_met: Location in or near an environmentally sensitive area - EIA requirement should be examined
    screening_category: environmental_impact_assessment
    verification_status: unverified
  - id: GH-LI1652-S5-WATER
    jurisdiction: ghana
    title: Water bodies as environmentally sensitive areas (Schedule 5, item 11)
    description: >-
      Water bodies are environmentally sensitive under Schedule 5 item 11 only where the water is tapped for
      domestic purposes, lies within controlled or protected areas, or supports wildlife and fishery activities.
      A water body near the site must be checked against these conditions.
    source_document_id: gh-li1652
    source_section: Regulation 30(2); Schedule 5, item 11
    official_source: {document_id: gh-li1652-official, anchor: "water tapped for domestic purposes"}
    official_text_check: {status: corrected, checked_on: "2026-11-01", note: "Previously any water body triggered the sensitive-area criterion; the official text attaches conditions."}
    condition:
      flags_any: [near_wetland_or_waterbody]
      always_indeterminate: true
    outcome_if_met: Water body may qualify as an environmentally sensitive area - check Schedule 5 item 11 conditions
    screening_category: further_regulatory_screening
    verification_status: unverified
  - id: GH-WRC-WATERUSE
    jurisdiction: ghana
    title: Water use permit (abstraction or discharge)
    description: >-
      Water use, including abstraction and discharge of wastewater into water bodies, is regulated by the Water
      Resources Commission under Act 522 and the Water Use Regulations, 2001 (L.I. 1692). Exemptions (e.g.
      certain domestic uses) must be checked.
    source_document_id: gh-wrc-act522
    source_section: Act 522, s.13; L.I. 1692
    official_text_check: {status: not_checked, note: "Official text of Act 522 / L.I. 1692 not yet ingested."}
    condition:
      activities_any: [water_abstraction, wastewater_discharge, impoundment_dam]
    outcome_if_met: Water use permit from the Water Resources Commission potentially required
    screening_category: sector_approval
    verification_status: unverified
  - id: GH-ACT703-MINERAL-RIGHT
    jurisdiction: ghana
    title: Mineral right / mining lease
    description: Mining operations require a mineral right granted under the Minerals and Mining Act, 2006 (Act 703).
    source_document_id: gh-act703
    source_section: Act 703, s.9
    official_text_check: {status: not_checked, note: "Official text of Act 703 not yet ingested."}
    condition:
      sectors_any: [mining]
    outcome_if_met: Mineral right (sector approval) potentially required in addition to the environmental permit
    screening_category: sector_approval
    verification_status: unverified

  - id: GH-ACT1124-S29
    jurisdiction: ghana
    title: Environmental assessment required by notice of the Authority (Act 1124, s.29)
    description: >-
      Under section 29(1) of the Environmental Protection Act, 2025 (Act 1124) the Environmental Protection
      Authority may, by written notice, require the entity responsible for an undertaking which in its opinion
      has or is likely to have an adverse effect on the environment to conduct an environmental assessment.
      Under s.29(5) other government bodies shall not grant a licence, permit, approval or consent for such a
      matter without the Authority's written approval. Whether a notice is issued is at the Authority's discretion.
    source_document_id: gh-act1124-official
    source_section: Act 1124, s.29
    official_source: {document_id: gh-act1124-official, anchor: "require an entity responsible for an undertaking which in the opinion of the Authority"}
    official_text_check: {status: added_from_official_text, checked_on: "2026-11-01", note: "OCR text; s.29(2) has a missing line in the OCR output - check the page image."}
    condition:
      sectors_any: [mining, agriculture, manufacturing, renewable_energy, road_construction, housing_development, waste_management, water_infrastructure]
      always_indeterminate: true
    outcome_if_met: Environmental assessment may be required by notice of the Authority; sector approvals need the Authority's written approval
    screening_category: environmental_impact_assessment
    verification_status: unverified
  - id: GH-ACT1124-S30
    jurisdiction: ghana
    title: Compensation plan for relocation, displacement or livelihood impacts (Act 1124, s.30)
    description: >-
      Section 30 of Act 1124: where the environmental assessment report indicates that the land for the
      undertaking will affect property and livelihoods, result in relocation or displacement of people, or
      restrict land use, the proponent shall prepare a compensation plan or compensation policy framework in
      accordance with guidelines issued by the Authority.
    source_document_id: gh-act1124-official
    source_section: Act 1124, s.30
    official_source: {document_id: gh-act1124-official, anchor: "the proponent shall prepare a compensation plan or compensation policy framework"}
    official_text_check: {status: added_from_official_text, checked_on: "2026-11-01", note: "OCR text."}
    condition:
      activities_any: [land_acquisition_resettlement]
    outcome_if_met: Compensation plan or compensation policy framework potentially required
    screening_category: sector_approval
    verification_status: unverified

  # ---------------------------------------------------------------- Germany
  - id: DE-UVPG-1.6.1
    jurisdiction: germany
    title: Wind farm - 20 or more turbines (UVPG Annex 1, No. 1.6.1, column X)
    description: Wind farms with turbines each of a total height of more than 50 m and 20 or more wind turbines are listed as subject to mandatory EIA.
    source_document_id: de-uvpg
    source_section: Annex 1, No. 1.6.1
    official_source: {document_id: de-uvpg-official, anchor: "Windfarm mit Anlagen mit einer Gesamthöhe von jeweils mehr als 50 Metern"}
    official_text_check: {status: consistent, checked_on: "2026-11-01", note: "Row 1.6 applies only to turbines with a total height of more than 50 m; height condition now encoded."}
    condition:
      activities_any: [power_generation_renewable]
      keywords_any: [wind]
      parameter: {name: turbine_count, op: ">=", value: 20}
      parameter_2: {name: turbine_height_m, op: ">", value: 50}
    outcome_if_met: Mandatory EIA category (X) potentially relevant
    screening_category: environmental_impact_assessment
    verification_status: unverified
  - id: DE-UVPG-1.6.2
    jurisdiction: germany
    title: Wind farm - 6 to fewer than 20 turbines (UVPG Annex 1, No. 1.6.2, column A)
    description: Wind farms (turbines > 50 m total height) with 6 to fewer than 20 turbines require a general preliminary assessment of the individual case.
    source_document_id: de-uvpg
    source_section: Annex 1, No. 1.6.2; Section 7
    official_source: {document_id: de-uvpg-official, anchor: "Windfarm mit Anlagen mit einer Gesamthöhe von jeweils mehr als 50 Metern"}
    official_text_check: {status: consistent, checked_on: "2026-11-01"}
    condition:
      activities_any: [power_generation_renewable]
      keywords_any: [wind]
      parameter: {name: turbine_count, op: between, min: 6, max: 19}
      parameter_2: {name: turbine_height_m, op: ">", value: 50}
    outcome_if_met: General preliminary assessment (A) category potentially relevant
    screening_category: preliminary_assessment
    verification_status: unverified
  - id: DE-UVPG-1.6.3
    jurisdiction: germany
    title: Wind farm - 3 to fewer than 6 turbines (UVPG Annex 1, No. 1.6.3, column S)
    description: Wind farms (turbines > 50 m total height) with 3 to fewer than 6 turbines require a site-related preliminary assessment.
    source_document_id: de-uvpg
    source_section: Annex 1, No. 1.6.3; Section 7
    official_source: {document_id: de-uvpg-official, anchor: "Windfarm mit Anlagen mit einer Gesamthöhe von jeweils mehr als 50 Metern"}
    official_text_check: {status: consistent, checked_on: "2026-11-01"}
    condition:
      activities_any: [power_generation_renewable]
      keywords_any: [wind]
      parameter: {name: turbine_count, op: between, min: 3, max: 5}
      parameter_2: {name: turbine_height_m, op: ">", value: 50}
    outcome_if_met: Site-related preliminary assessment (S) category potentially relevant
    screening_category: preliminary_assessment
    verification_status: unverified
  - id: DE-UVPG-2.1.1
    jurisdiction: germany
    title: Quarry with an extraction area of more than 25 ha (UVPG Annex 1, No. 2.1.1, column X)
    description: Construction and operation of a quarry (Steinbruch) with an extraction area of more than 25 ha is listed as subject to mandatory EIA.
    source_document_id: de-uvpg
    source_section: Annex 1, No. 2.1.1
    official_source: {document_id: de-uvpg-official, anchor: "Steinbruchs mit einer Abbaufläche von"}
    official_text_check: {status: corrected, checked_on: "2026-11-01", note: "Official threshold is 'mehr als 25 ha' (more than 25 ha); previously encoded as 25 ha or more."}
    condition:
      sectors_any: [mining]
      keywords_any: [quarry, quarrying, steinbruch]
      parameter: {name: project_area_ha, op: ">", value: 25}
    outcome_if_met: Mandatory EIA category (X) potentially relevant
    screening_category: environmental_impact_assessment
    verification_status: unverified
  - id: DE-UVPG-2.1.2
    jurisdiction: germany
    title: Quarry with an extraction area of 10 ha to 25 ha (UVPG Annex 1, No. 2.1.2, column A)
    description: Quarries with an extraction area of 10 ha to 25 ha require a general preliminary assessment of the individual case.
    source_document_id: de-uvpg
    source_section: Annex 1, No. 2.1.2; Section 7
    official_source: {document_id: de-uvpg-official, anchor: "Steinbruchs mit einer Abbaufläche von"}
    official_text_check: {status: added_from_official_text, checked_on: "2026-11-01"}
    condition:
      sectors_any: [mining]
      keywords_any: [quarry, quarrying, steinbruch]
      parameter: {name: project_area_ha, op: between, min: 10, max: 25}
    outcome_if_met: General preliminary assessment (A) category potentially relevant
    screening_category: preliminary_assessment
    verification_status: unverified
  - id: DE-UVPG-2.1.3
    jurisdiction: germany
    title: Quarry under 10 ha using explosives (UVPG Annex 1, No. 2.1.3, column S)
    description: Quarries with an extraction area of less than 10 ha require a site-related preliminary assessment where explosives are used.
    source_document_id: de-uvpg
    source_section: Annex 1, No. 2.1.3; Section 7
    official_source: {document_id: de-uvpg-official, anchor: "Steinbruchs mit einer Abbaufläche von"}
    official_text_check: {status: added_from_official_text, checked_on: "2026-11-01"}
    condition:
      sectors_any: [mining]
      keywords_any: [quarry, quarrying, steinbruch]
      parameter: {name: project_area_ha, op: "<", value: 10}
      parameter_2: {name: explosives_used, op: ">=", value: 1}
    outcome_if_met: Site-related preliminary assessment (S) category potentially relevant
    screening_category: preliminary_assessment
    verification_status: unverified
  - id: DE-UVPG-7.3.1
    jurisdiction: germany
    title: Intensive broiler (Mastgeflügel) installation with 85 000 or more places (UVPG Annex 1, No. 7.3.1, column X)
    description: Installations for intensive rearing of meat poultry with 85 000 or more places are listed as subject to mandatory EIA.
    source_document_id: de-uvpg
    source_section: Annex 1, No. 7.3.1
    official_source: {document_id: de-uvpg-official, anchor: "Intensivhaltung oder -aufzucht von Mastgeflügel"}
    official_text_check: {status: added_from_official_text, checked_on: "2026-11-01"}
    condition:
      activities_any: [livestock_rearing]
      parameter: {name: broiler_count, op: ">=", value: 85000}
    outcome_if_met: Mandatory EIA category (X) potentially relevant
    screening_category: environmental_impact_assessment
    verification_status: unverified
  - id: DE-UVPG-7.3.2
    jurisdiction: germany
