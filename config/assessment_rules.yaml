# Setting flags derived deterministically from the environmental setting text.
setting_flags:
  near_protected_area: [protected area, national park, forest reserve, ramsar, natura 2000, nature reserve, ffh, wildlife sanctuary, game reserve, important bird area]
  near_wetland_or_waterbody: [river, wetland, lagoon, estuary, lake, stream, mangrove, reservoir, creek]
  near_cultural_heritage: [heritage, sacred grove, shrine, archaeolog, monument, burial, cemetery, listed building]
  near_settlement: [community, village, town, settlement, residents, households, school, hospital, city]

risk_methodology:
  version: "EIAGen-RS-1"
  description: >-
    Preliminary environmental risk prioritisation. Score = likelihood (1-3) x severity
    (1-3), plus 1 if the receptor sensitivity is high (maximum 9). Scale escalators may
    raise severity by one level. Priority bands: 1-2 low, 3-5 medium, 6-9 high.
    This is a project-defined screening heuristic, not a statutory significance method.
  likelihood: {unlikely: 1, possible: 2, likely: 3}
  severity: {minor: 1, moderate: 2, major: 3}
  sensitivity_bonus: {high: 1, medium: 0, low: 0}
  bands: {low: [1, 2], medium: [3, 5], high: [6, 9]}
  # Heuristic scale escalators (non-statutory). Raise severity one level for the
  # listed components when the parameter meets the value.
  scale_escalators:
    - {parameter: project_area_ha, op: ">=", value: 100, components: [habitats, vegetation, land, soil, carbon_storage, land_tenure]}
    - {parameter: water_demand, op: ">=", value: 1000, components: [resources, groundwater, hydrology, resource_access]}
    - {parameter: workforce, op: ">=", value: 500, components: [social_cohesion, community_health]}
    - {parameter: road_length_km, op: ">=", value: 20, components: [habitats, land_tenure, livelihoods]}
  assumptions:
    - Defaults per impact type come from config/impact_taxonomy.yaml and are generic.
    - Receptor sensitivity is "high" only when the description or setting names the receptor.
    - Scores rank issues for further investigation; they do not indicate significance.
  limitations:
    - No site data, modelling or field survey informs the score.
    - Ordinal scales are multiplied for ranking only; the result is not a measurement.
    - Beneficial effects are listed but not scored as risks.

missing_information:
  general:
    - key: location
      description: Specific project location (district / municipality and nearest settlement)
      importance: critical
      question: Where exactly is the project located (district or municipality, and the nearest settlement)?
    - key: coordinates
      description: Project coordinates or site boundary
      importance: important
      question: Can you provide site coordinates (latitude/longitude) or a site boundary file?
    - key: project_area_ha
      description: Total project footprint
      importance: critical
      question: What is the total land area of the project (in hectares), including temporary construction areas?
    - key: environmental_setting
      description: Description of the environmental setting (water bodies, habitats, settlements, protected areas)
      importance: critical
      question: Describe the site setting - nearby rivers or wetlands, vegetation, protected areas, settlements and current land use.
    - key: distance_to_receptors
      description: Distances to the nearest sensitive receptors
      importance: important
      question: What are the distances from the site boundary to the nearest watercourse, settlement and protected area?
    - key: project_duration_months
      description: Construction and operation schedule
      importance: important
      question: What are the construction duration, the expected operational lifetime and the working hours?
    - key: workforce
      description: Workforce numbers and accommodation
      importance: useful
      question: How many workers are expected during construction and operation, and will they be accommodated on site?
    - key: waste_streams
      description: Waste types and quantities, and their management
      importance: important
      question: What waste streams (types and quantities) will be generated, and how will they be managed?
    - key: land_tenure
      description: Land ownership and current users
      importance: important
      question: Who owns and currently uses the land, and will any land acquisition or relocation be required?
    - key: project_phase
      description: Current project development phase
      importance: useful
      question: What is the current development phase (concept, feasibility, design, construction)?
  conditional:
    - key: water_demand
      when_activities_any: [water_abstraction, mineral_processing, industrial_processing, agricultural_operations, residential_occupation]
      description: Water demand and source
      importance: important
      question: What is the expected water demand (m3/day) and from which source will water be obtained?
    - key: wastewater_volume
      when_activities_any: [wastewater_discharge, mineral_processing, industrial_processing, livestock_rearing]
      description: Wastewater quantity, quality, treatment and discharge point
      importance: important
      question: What volume and type of wastewater will be generated, how will it be treated, and where will it be discharged?
    - key: energy_demand
      when_activities_any: [energy_consumption, industrial_processing, mineral_processing]
      description: Energy demand and supply source
      importance: useful
      question: What is the energy demand and how will it be supplied (grid, diesel generators, renewables)?
    - key: hazardous_materials
      when_activities_any: [hazardous_materials_storage, mineral_processing]
      description: Hazardous materials inventory and storage arrangements
      importance: important
      question: Which hazardous materials (types, quantities) will be stored and how will storage be contained?
