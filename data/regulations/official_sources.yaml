# Official regulatory texts.
#
# Run:  python scripts/fetch_official_sources.py
#
# The PDFs are NOT committed to the repository (data/regulations/official/ is
# git-ignored): they are fetched from the issuing authority, or placed there by
# hand where the publisher blocks automated downloads (fetch: manual).
#
# observed_sha256 records the file obtained on observed_on; consolidated laws are
# updated over time, so a different checksum means a newer version - re-check the
# version line and re-run the criteria cross-check.
#
# summary_document_id links the official text to the curated summary in
# manifest.yaml; citations to the summary are then linked to the official
# provision through data/regulations/crosswalk.yaml.

observed_on: "2026-11-01"

