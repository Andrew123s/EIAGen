# Crosswalk: curated-summary sections -> official provisions.
#
# Each anchor is a short verbatim phrase from the official text (whitespace-
# insensitive). When a summary passage is cited, EIAGen also cites the official
# passage that contains the anchor, so a reviewer can check the paraphrase
# against the official wording. Anchors are matched against a passage's section
# heading first, then its text. Unresolved anchors are reported by
# scripts/check_crosswalk.py and simply produce no official link.

crosswalk:
  gh-li1652:
    official: gh-li1652-official
    sections:
      "Regulation 1 - Registration of new undertakings (Schedule 1)": "No person shall commence any of the undertakings specified in Schedule 1"
      "Regulation 3 - Undertakings requiring environmental impact assessment (Schedule 2)": "No environmental permit shall be issued by the Agency for any of the undertakings mentioned in Schedule 2"
      "Schedule 5 - Environmentally sensitive areas": "All areas declared by law as national parks"
      "Screening of applications": "Initial assessment by screening of application"
      "Preliminary environmental report": "Preliminary environmental report"
      "Scoping and terms of reference": "A scoping report shall set out the scope or extent of the environmental impact assessment"
      "Environmental impact statement": "The environmental impact statement shall also address possible direct and indirect impact"
      "Public hearings and consultation": "The Agency shall hold a public hearing in respect of an application"
      "Environmental management plan and permit conditions": "shall submit to the Agency an environmental management plan in respect of his operations"

