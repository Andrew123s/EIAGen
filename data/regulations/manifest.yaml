# Regulatory document manifest - seed knowledge base.
#
# content_form:
#   curated_summary - prepared by the EIAGen maintainers from their reading of the
#                     instrument; NOT official text. Every citation to these
#                     documents is flagged "verification required".
#   official_text   - the published official document (e.g. a PDF downloaded from
#                     the issuing authority). Add these with scripts/ingest_regulations.py.
#
# document_type (legal nature of the underlying instrument):
#   legislation | regulation | guideline | technical_standard |
#   international_framework | non_binding_recommendation
#
# date_last_verified is null for every seed document: none has been checked against
# the official text by a qualified reviewer. status_verified=false means the current
# legal status (in force / amended / repealed) has not been confirmed.

